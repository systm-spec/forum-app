name: forum-app

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env.local}
      POSTGRES_USER: ${PGUSER:?Set PGUSER in .env.local}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env.local}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
